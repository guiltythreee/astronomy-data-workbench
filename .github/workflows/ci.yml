name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests (unit, integration, docs checks)
        run: pytest
      - name: Package build
        run: python -m build
      - name: Installed-wheel smoke test (package data present)
        run: |
          python -m venv /tmp/wheelenv
          /tmp/wheelenv/bin/pip install dist/*.whl
          /tmp/wheelenv/bin/adw explorer --out /tmp/explorer.html
          /tmp/wheelenv/bin/adw coords-lab --out /tmp/coords.json
      - name: CLI smoke test on synthetic fixture
        run: |
          adw inspect tests/fixtures/bsc_synthetic.tsv
          adw export bsc-tsv tests/fixtures/bsc_synthetic.tsv --out adw-out
          adw audit adw-out --source tests/fixtures/bsc_synthetic.tsv
          adw crossmatch demo --out /tmp/adw-crossmatch-demo
