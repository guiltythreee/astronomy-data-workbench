name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Tests (unit, integration, docs checks)
        run: pytest
      - name: Package build
        run: python -m build
      - name: CLI smoke test on synthetic fixture
        run: |
          adw inspect tests/fixtures/bsc_synthetic.tsv
          adw export bsc-tsv tests/fixtures/bsc_synthetic.tsv --out adw-out
          adw audit adw-out --source tests/fixtures/bsc_synthetic.tsv
